[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FIT_python"
version = "0.1.0"
description = "FIT Otter: Data import and analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"

# Standard dependencies
dependencies = [
  "pandas>=1.3",
  "xlrd>=1.2",
  "openpyxl>=3.0",
  "numpy>=1.21",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "optuna",
  "catboost",
  "xgboost",
  "lightgbm",
  "scipy",
  "umap-learn",
  "scikit-optimize",
  "PyQt5",
  "tqdm",
  "tqdm-joblib",        # ← hier rein, nicht nur dev
  "joblib",
]

authors = [
  { name = "Frederick Kistner" }
]

# Optional extras
[project.optional-dependencies]
dev = [
  "pytest",
  "coverage",
  "flake8",
  "mypy",
  "missingpy",
  "jupyterlab",
  "pyarrow",
]
torch = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]                      # wichtig für deine Struktur
include = ["FIT_python", "FIT_python.*"]
